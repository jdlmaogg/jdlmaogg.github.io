<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Nostalgia</title>
  <style>
    :root {
      --bg-1: #08131d;
      --bg-2: #10243b;
      --panel: rgba(10, 18, 28, 0.75);
      --panel-border: rgba(255,255,255,0.18);
      --text: #edf6ff;
      --muted: rgba(237, 246, 255, 0.8);
      --win95-blue: #000080;
      --win95-light: #dfe9ff;
      --win95-sky: #a9e5ff;
      --win95-gray: #c0c0c0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at 50% 16%, #1c3e63 0%, var(--bg-2) 32%, var(--bg-1) 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .shell {
      width: min(860px, 90vw);
      padding: 34px 32px 28px;
      background: rgba(8, 14, 18, 0.76);
      border: 2px solid var(--panel-border);
      box-shadow: 0 22px 70px rgba(0,0,0,0.5);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 16px;
      border: 2px solid #ffffff;
      background: linear-gradient(180deg, #eef5ff, #b8cbff);
      color: #111;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.28);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
      font-weight: 900;
    }

    p {
      max-width: 700px;
      margin: 0 auto 28px;
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--muted);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      height: 54px;
      padding: 0 28px;
      text-decoration: none;
      color: #000;
      font-weight: 700;
      font-size: 1.05rem;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
      border-right: 2px solid #7a7a7a;
      border-bottom: 2px solid #7a7a7a;
      background: linear-gradient(180deg, #fefefe, #d7d7d7);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 5px 5px 0 rgba(0,0,0,0.24);
    }

    .btn.primary {
      background: linear-gradient(180deg, #dff5ff, #9ad9ff);
    }

    .btn.secondary {
      background: linear-gradient(180deg, #ffffff, #d5dfe8);
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="badge">Desktop Nostalgia</div>
    <h1>Windows 95, but online.</h1>
    <p>
      A browser-based throwback to the classic Windows 95 desktop experience — complete with the Start menu,
      taskbar, programs, retro mood, and that early 90s desktop feeling.
    </p>

    <div class="actions">
      <a class="btn primary" href="/win95/">Launch the Desktop</a>
      <a class="btn secondary" href="https://desktopnostalgia.com" target="_blank" rel="noreferrer">Visit the Original</a>
    </div>
  </main>
</body>
</html>
