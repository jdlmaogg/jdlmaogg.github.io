<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows 95 Desktop</title>
    <style>
      :root {
        --win95-blue: #000080;
        --win95-blue-alt: #1084d0;
        --win95-gray-1: #c0c0c0;
        --win95-gray-2: #d4d0c8;
        --win95-gray-3: #808080;
        --win95-gray-4: #ffffff;
        --win95-gray-5: #000000;
        --win95-wallpaper-1: #008080;
        --win95-wallpaper-2: #0f8a8a;
        --win95-wallpaper-3: #0d7171;
        --win95-shadow: rgba(0, 0, 0, 0.35);
        --win95-taskbar: #c0c0c0;
        --win95-btn-face: #dfdfdf;
        --win95-green: #1b5e20;
        --win95-red: #b22222;
        --surface: rgba(255,255,255,0.04);
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "MS Sans Serif", "Tahoma", sans-serif;
        background: #000;
        color: #000;
        cursor: default;
      }

      body {
        position: relative;
        background: linear-gradient(180deg, var(--win95-wallpaper-1) 0%, var(--win95-wallpaper-2) 28%, var(--win95-wallpaper-3) 100%);
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.02)),
          repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.025),
            rgba(0,0,0,0.025) 1px,
            transparent 1px,
            transparent 2px
          );
      }

      #desktop {
        position: absolute;
        inset: 0 0 36px 0;
        overflow: hidden;
      }

      .desktop-icon {
        position: absolute;
        width: 80px;
        padding: 4px 5px;
        color: #fff;
        text-align: center;
        font-size: 11px;
        line-height: 1.1;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.85);
        cursor: pointer;
      }

      .desktop-icon.selected {
        background: rgba(0,0,0,0.14);
        border: 1px dotted #fff;
      }

      .desktop-icon .icon {
        position: relative;
        display: block;
        width: 32px;
        height: 32px;
        margin: 0 auto 5px;
        filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.5));
      }

      .icon-computer::before,
      .icon-computer::after,
      .icon-doc::before,
      .icon-doc::after,
      .icon-bin::before,
      .icon-bin::after,
      .icon-browser::before,
      .icon-browser::after,
      .icon-notepad::before,
      .icon-notepad::after,
      .icon-calc::before,
      .icon-calc::after,
      .icon-game::before,
      .icon-game::after {
        content: "";
        position: absolute;
      }

      .icon-computer::before {
        left: 4px; right: 4px; bottom: 8px; height: 18px;
        background: #c0c0c0;
        border: 2px solid #666;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: inset -2px -2px 0 rgba(0,0,0,0.16);
      }

      .icon-computer::after {
        left: 8px; right: 8px; bottom: 2px; height: 7px;
        background: #c0c0c0;
        border: 2px solid #666;
        border-top: none;
      }

      .icon-doc::before {
        inset: 2px 8px 2px 8px;
        background: #fff;
        border: 1px solid rgba(0,0,0,0.4);
      }

      .icon-doc::after {
        left: 15px; top: 6px; width: 10px; height: 2px;
        background: #c0c0c0;
        box-shadow: 0 5px 0 #c0c0c0, 0 10px 0 #c0c0c0;
      }

      .icon-bin::before {
        left: 6px; right: 6px; bottom: 6px; height: 20px;
        background: #d9d9d9;
        border: 2px solid #666;
        border-top: none;
        box-shadow: inset 0 0 0 2px #fff;
      }

      .icon-bin::after {
        left: 7px; right: 7px; top: 4px; height: 6px;
        background: #d9d9d9;
        border: 2px solid #666;
        border-bottom: none;
      }

      .icon-browser::before {
        left: 4px; top: 4px; width: 24px; height: 18px;
        background: linear-gradient(180deg, #3a93ff, #165fe1);
        border: 2px solid #1d1d1d;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
      }

      .icon-browser::after {
        content: "e";
        position: absolute;
        left: 12px; top: 5px;
        color: white;
        font-size: 16px;
        font-weight: bold;
      }

      .icon-notepad::before {
        left: 8px; right: 8px; top: 4px; bottom: 4px;
        background: white;
        border: 1px solid rgba(0,0,0,0.5);
      }

      .icon-notepad::after {
        left: 13px; top: 9px; width: 12px; height: 2px;
        background: #bcbcbc;
        box-shadow: 0 4px 0 #bcbcbc, 0 8px 0 #bcbcbc;
      }

      .icon-calc::before {
        inset: 4px 5px 4px 5px;
        background: #d9d9d9;
        border: 2px solid #666;
        box-shadow: inset 1px 1px 0 #fff;
      }

      .icon-calc::after {
        content: "±";
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        font-weight: 700;
        font-size: 18px;
      }

      .icon-game::before {
        inset: 4px 5px 4px 5px;
        background: linear-gradient(180deg, #fafafa, #d9d9d9);
        border: 2px solid #666;
        box-shadow: inset 1px 1px 0 #fff;
      }

      .icon-game::after {
        content: "✦";
        left: 9px; top: 8px;
        color: #b22222;
        font-size: 17px;
        font-weight: 700;
      }

      .window {
        position: absolute;
        display: flex;
        flex-direction: column;
        min-width: 220px;
        min-height: 150px;
        background: var(--win95-gray-2);
        border: 2px solid #000;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: 2px 2px 0 var(--win95-shadow);
        overflow: hidden;
        z-index: 1;
      }

      .window.active {
        box-shadow: 3px 3px 0 rgba(0,0,0,0.45);
      }

      .title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 27px;
        padding: 4px 6px 4px 8px;
        color: white;
        background: linear-gradient(90deg, #000080, #1084d0);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
        cursor: move;
      }

      .title-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }

      .window-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .win-btn {
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--win95-gray-1);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        color: #000;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        padding: 0;
        margin: 0;
        cursor: pointer;
      }

      .win-btn:active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .window-body {
        flex: 1;
        background: var(--win95-gray-2);
        padding: 8px;
        overflow: auto;
      }

      .explorer, .browser, .notepad, .game-window {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .explorer {
        border: 2px inset #c0c0c0;
        background: white;
      }

      .explorer-toolbar,
      .browser-toolbar,
      .game-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: #efefef;
        border-bottom: 1px solid #808080;
        font-size: 12px;
      }

      .explorer-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .explorer-sidebar {
        width: 146px;
        background: #f3f3f3;
        border-right: 1px solid #808080;
        padding: 8px;
        font-size: 12px;
        line-height: 1.8;
      }

      .drive-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border: 1px solid transparent;
      }

      .drive-row:hover {
        background: #d9ebff;
        border-color: #000080;
      }

      .drive-icon {
        width: 18px; height: 18px;
        position: relative;
        background: linear-gradient(#7e7e7e, #a0a0a0);
        border: 1px solid #000;
      }

      .drive-icon::before {
        content: "";
        position: absolute;
        inset: 4px 3px 3px 3px;
        background: linear-gradient(#d8d8d8, #8d8d8d);
      }

      .explorer-main {
        flex: 1;
        padding: 10px;
        overflow: auto;
        font-size: 12px;
      }

      .explorer-main h3 {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .browser {
        border: 2px inset #c0c0c0;
        background: white;
      }

      .browser-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .address-bar {
        flex: 1;
        background: white;
        border: 1px solid #7a7a7a;
        padding: 3px 6px;
        font-size: 12px;
      }

      .browser-page {
        flex: 1;
        overflow: auto;
        padding: 12px;
        font-size: 12px;
        line-height: 1.6;
        background: #fff;
      }

      .browser-page h3, .browser-page h4 { margin-top: 0; }
      .browser-page a { color: #000080; text-decoration: underline; }

      .notepad {
        background: var(--win95-gray-2);
      }

      .notepad-toolbar {
        padding: 4px;
        background: var(--win95-gray-2);
        border-bottom: 1px solid #808080;
        font-size: 12px;
      }

      .notepad-textarea {
        flex: 1;
        width: 100%;
        resize: none;
        border: 2px inset #c0c0c0;
        background: white;
        padding: 8px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        outline: none;
      }

      .calculator {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: var(--win95-gray-2);
        padding: 8px;
      }

      .calc-display {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        background: white;
        border: 2px inset #bdbdbd;
        min-height: 48px;
        padding: 8px;
        margin-bottom: 8px;
        font-family: "Courier New", monospace;
        font-size: 22px;
        font-weight: 700;
      }

      .calc-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .calc-btn {
        height: 34px;
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        background: var(--win95-btn-face);
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }

      .calc-btn:active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .calc-btn.wide {
        grid-column: span 2;
      }

      .about-box {
        height: 100%;
        border: 1px solid #000;
        background: white;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
      }

      .about-logo {
        font-size: 28px;
        font-weight: 700;
        color: var(--win95-blue);
        text-align: center;
        margin-bottom: 10px;
      }

      .game-window {
        background: var(--win95-gray-2);
      }

      .game-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #c0c0c0;
        padding: 10px;
      }

      .minesweeper-board {
        display: grid;
        grid-template-columns: repeat(9, 24px);
        gap: 2px;
        background: #808080;
        border: 2px solid #fff;
        box-shadow: inset 2px 2px 0 #7a7a7a;
        padding: 4px;
      }

      .cell {
        width: 24px; height: 24px;
        background: #c0c0c0;
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .cell.revealed {
        border: 1px solid #808080;
        background: #d4d0c8;
        box-shadow: inset 1px 1px 0 rgba(0,0,0,0.15);
        cursor: default;
      }

      .solitaire-board {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
        max-width: 340px;
        min-height: 180px;
        background: var(--win95-green);
        border: 2px solid #000;
        padding: 16px 12px;
        box-shadow: inset 2px 2px 0 rgba(255,255,255,0.25);
      }

      .solitaire-pile {
        position: relative;
        width: 42px; height: 56px;
        border: 2px solid rgba(255,255,255,0.35);
        border-radius: 2px;
        background: rgba(255,255,255,0.12);
      }

      .card {
        position: relative;
        width: 42px; height: 56px;
        display: flex;
        align-items: center; justify-content: center;
        border: 2px solid #000;
        border-radius: 3px;
        background: white;
        font-size: 18px;
        font-weight: 700;
        box-shadow: 1px 1px 0 rgba(0,0,0,0.25);
      }

      .card.red { color: #c00000; }
      .card.black { color: #000; }

      .taskbar {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 36px;
        background: var(--win95-taskbar);
        border-top: 2px solid #fff;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        z-index: 2000;
      }

      .start-btn {
        height: 28px;
        min-width: 94px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: linear-gradient(180deg, #f8f8f8, #d6d6d6);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        padding: 0 14px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .start-btn:active,
      .start-btn.active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .start-logo {
        display: inline-block;
        width: 15px; height: 15px;
        position: relative;
        background: linear-gradient(135deg, #ff0000 0%, #ff0000 45%, #000 45%, #000 100%);
        border: 1px solid #000;
        transform: rotate(45deg);
      }

      .taskbar-buttons {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 1;
        overflow: hidden;
      }

      .task-btn {
        min-width: 130px;
        max-width: 180px;
        height: 28px;
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        padding: 0 8px;
        background: linear-gradient(180deg, #f7f7f7, #d6d6d6);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        font-size: 12px;
        cursor: pointer;
      }

      .task-btn.active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        background: linear-gradient(180deg, #ddd, #c0c0c0);
      }

      .taskbar-clock {
        width: 92px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d4d0c8;
        border-top: 2px solid #7b7b7b;
        border-left: 2px solid #7b7b7b;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 0 6px;
      }

      .start-menu {
        position: absolute;
        left: 4px;
        bottom: 38px;
        width: 270px;
        height: 390px;
        background: var(--win95-gray-1);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        display: none;
        z-index: 3000;
      }

      .start-menu.show { display: flex; }

      .start-side {
        width: 32px;
        background: linear-gradient(180deg, #7a7a7a, #c0c0c0);
        color: white;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 1px;
      }

      .start-items {
        flex: 1;
        background: #c0c0c0;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .start-item {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        padding: 6px 8px;
        font-size: 12px;
        cursor: pointer;
      }

      .start-item:hover {
        background: #000080;
        color: white;
      }

      .mini-icon {
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #000;
        background: #d9d9d9;
        font-size: 12px;
        font-weight: 700;
      }

      .window-resize-handle {
        position: absolute;
        right: 0; bottom: 0;
        width: 12px;
        height: 12px;
        background: linear-gradient(135deg, #808080 0%, #d9d9d9 35%, #fff 35%, #fff 100%);
        border-top: 1px solid #000;
        border-left: 1px solid #000;
        cursor: nwse-resize;
      }

      .hidden { display: none !important; }

      .boot-screen {
        position: absolute;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #000000 0%, #050d1f 100%);
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }

      body.booted .boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #fff;
        text-align: center;
        transform: scale(1.02);
        animation: bootPulse 2.2s ease-in-out infinite alternate;
      }

      .boot-logo {
        width: 205px; height: 62px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #1f52ff 0%, #000080 52%, #050d88 100%);
        border: 2px solid #4e7aff;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08), 0 0 18px rgba(94,147,255,0.42);
        color: #f3f9ff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      }

      .boot-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(230, 240, 255, 0.9);
      }

      .boot-cursor {
        display: inline-block;
        width: 12px;
        height: 18px;
        background: #f2f7ff;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
        animation: blinkCursor 0.7s steps(1) infinite;
      }

      @keyframes blinkCursor {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }

      @keyframes bootPulse {
        from { transform: scale(0.98); opacity: 0.76; }
        to { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="boot-screen">
      <div class="boot-panel">
        <div class="boot-logo">Windows</div>
        <div class="boot-label">Starting<span class="boot-cursor"></span></div>
      </div>
    </div>

    <div id="desktop"></div>

    <div id="taskbar" class="taskbar">
      <div id="startBtn" class="start-btn"><span class="start-logo"></span><span>Start</span></div>
      <div id="taskbarButtons" class="taskbar-buttons"></div>
      <div id="clock" class="taskbar-clock">12:00 PM</div>
    </div>

    <div id="startMenu" class="start-menu">
      <div class="start-side">Start</div>
      <div class="start-items">
        <div class="start-item" data-app="mycomputer"><span class="mini-icon">💻</span> My Computer</div>
        <div class="start-item" data-app="documents"><span class="mini-icon">📁</span> My Documents</div>
        <div class="start-item" data-app="recycle"><span class="mini-icon">🗑</span> Recycle Bin</div>
        <div class="start-item" data-app="ie"><span class="mini-icon">🌐</span> Internet Explorer</div>
        <div class="start-item" data-app="notepad"><span class="mini-icon">📝</span> Notepad</div>
        <div class="start-item" data-app="calc"><span class="mini-icon">🧮</span> Calculator</div>
        <div class="start-item" data-app="minesweeper"><span class="mini-icon">💣</span> Minesweeper</div>
        <div class="start-item" data-app="solitaire"><span class="mini-icon">♠</span> Solitaire</div>
        <div class="start-item" data-app="about"><span class="mini-icon">ℹ</span> About</div>
      </div>
    </div>

    <script>
      const desktop = document.getElementById('desktop');
      const taskbarButtons = document.getElementById('taskbarButtons');
      const startBtn = document.getElementById('startBtn');
      const startMenu = document.getElementById('startMenu');
      const clock = document.getElementById('clock');
      const windowRegistry = new Map();
      let zCounter = 10;

      function formatClock() {
        const now = new Date();
        const hours = now.getHours();
        const mins = String(now.getMinutes()).padStart(2, '0');
        const period = hours >= 12 ? 'PM' : 'AM';
        const normalized = ((hours + 11) % 12) + 1;
        clock.textContent = `${normalized}:${mins} ${period}`;
      }

      function bringToFront(win) {
        zCounter += 1;
        win.style.zIndex = String(zCounter);
        document.querySelectorAll('.window').forEach((item) => item.classList.remove('active'));
        win.classList.add('active');

        const appId = [...windowRegistry.entries()].find(([, value]) => value.window === win)?.[0];
        document.querySelectorAll('.task-btn').forEach((btn) => btn.classList.remove('active'));
        if (appId) {
          const match = [...taskbarButtons.children].find((btn) => btn.dataset.appId === appId);
          if (match) match.classList.add('active');
        }
      }

      function buildDeskIcon({ id, label, x, y, icon, click }) {
        const item = document.createElement('div');
        item.className = 'desktop-icon';
        item.style.left = `${x}px`;
        item.style.top = `${y}px`;
        item.dataset.app = id;
        item.innerHTML = `<span class="icon icon-${icon}"></span><div>${label}</div>`;
        item.addEventListener('dblclick', click);
        item.addEventListener('click', () => {
          document.querySelectorAll('.desktop-icon').forEach((el) => el.classList.remove('selected'));
          item.classList.add('selected');
        });
        desktop.appendChild(item);
      }

      function openWindow(appId) {
        const app = appDefs.find((item) => item.id === appId);
        if (!app) return;

        if (windowRegistry.has(appId)) {
          const existing = windowRegistry.get(appId);
          existing.window.classList.remove('hidden');
          bringToFront(existing.window);
          return;
        }

        const win = document.createElement('div');
        win.className = 'window';
        win.style.left = `${app.x}px`;
        win.style.top = `${app.y}px`;
        win.style.width = `${app.width}px`;
        win.style.height = `${app.height}px`;

        const titleBar = document.createElement('div');
        titleBar.className = 'title-bar';
        titleBar.innerHTML = `
          <div class="title-text">${app.title}</div>
          <div class="window-controls">
            <button class="win-btn" type="button" aria-label="Minimize">_</button>
            <button class="win-btn" type="button" aria-label="Maximize">□</button>
            <button class="win-btn" type="button" aria-label="Close">×</button>
          </div>
        `;

        const body = document.createElement('div');
        body.className = 'window-body';
        body.appendChild(app.render());

        const closeBtn = titleBar.querySelectorAll('.win-btn')[2];
        const minimizeBtn = titleBar.querySelectorAll('.win-btn')[0];
        const maximizeBtn = titleBar.querySelectorAll('.win-btn')[1];

        closeBtn.addEventListener('click', () => {
          win.classList.add('hidden');
        });
        minimizeBtn.addEventListener('click', () => {
          win.classList.add('hidden');
        });
        maximizeBtn.addEventListener('click', () => {
          const isMax = win.dataset.maximized === 'true';
          win.dataset.maximized = String(!isMax);
          if (!isMax) {
            win.style.left = '20px';
            win.style.top = '20px';
            win.style.width = `${window.innerWidth - 40}px`;
            win.style.height = `${window.innerHeight - 100}px`;
          } else {
            win.style.left = `${app.x}px`;
            win.style.top = `${app.y}px`;
            win.style.width = `${app.width}px`;
            win.style.height = `${app.height}px`;
          }
        });

        win.appendChild(titleBar);
        win.appendChild(body);

        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'window-resize-handle';
        win.appendChild(resizeHandle);
        desktop.appendChild(win);

        let dragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let originLeft = 0;
        let originTop = 0;

        titleBar.addEventListener('mousedown', (event) => {
          dragging = true;
          const rect = win.getBoundingClientRect();
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          originLeft = rect.left;
          originTop = rect.top;
          bringToFront(win);
        });

        document.addEventListener('mousemove', (event) => {
          if (!dragging) return;
          const dx = event.clientX - dragStartX;
          const dy = event.clientY - dragStartY;
          win.style.left = `${Math.max(0, originLeft + dx)}px`;
          win.style.top = `${Math.max(0, originTop + dy)}px`;
        });

        document.addEventListener('mouseup', () => { dragging = false; });

        const taskBtn = document.createElement('button');
        taskBtn.type = 'button';
        taskBtn.className = 'task-btn';
        taskBtn.dataset.appId = appId;
        taskBtn.textContent = app.title;
        taskBtn.addEventListener('click', () => {
          if (win.classList.contains('hidden')) win.classList.remove('hidden');
          bringToFront(win);
        });
        taskbarButtons.appendChild(taskBtn);

        win.addEventListener('mousedown', () => bringToFront(win));

        windowRegistry.set(appId, { window: win, taskBtn, appId });
        bringToFront(win);
      }

      function stripHtml(raw) {
        return raw
          .replace(/<script[\s\S]*?<\/script>/gi, ' ')
          .replace(/<style[\s\S]*?<\/style>/gi, ' ')
          .replace(/<[^>]+>/g, ' ')
          .replace(/&nbsp;/gi, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      async function fetchViaProxy(targetUrl) {
        const cleaned = targetUrl.trim();
        if (!cleaned) throw new Error('Enter a URL first.');
        const candidates = [
          () => `https://r.jina.ai/http://${cleaned.replace(/^https?:\/\//, '')}`,
          () => `https://api.allorigins.win/get?url=${encodeURIComponent(cleaned)}`,
          () => `https://corsproxy.io/?${encodeURIComponent(cleaned)}`
        ];

        let lastError = null;

        for (const factory of candidates) {
          try {
            const url = factory();
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const contentType = response.headers.get('content-type') || '';

            if (contentType.includes('application/json')) {
              const data = await response.json();
              const text = data && typeof data.contents === 'string' ? data.contents : JSON.stringify(data);
              if (text && text.length) return text;
            }

            const text = await response.text();
            if (text && text.length) return text;
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError || new Error('Unable to fetch this page through the available proxy endpoints.');
      }

      function createBrowserApp() {
        const wrapper = document.createElement('div');
        wrapper.className = 'browser';

        const toolbar = document.createElement('div');
        toolbar.className = 'browser-toolbar';

        const addressBar = document.createElement('input');
        addressBar.className = 'address-bar';
        addressBar.value = 'https://example.com';

        const goBtn = document.createElement('button');
        goBtn.type = 'button';
        goBtn.className = 'win-btn';
        goBtn.textContent = 'Go';

        const page = document.createElement('div');
        page.className = 'browser-page';
        page.innerHTML = '<h3>Web Browser</h3><p>Load a page to preview it via the built-in proxy.</p>';

        async function loadPage() {
          const target = addressBar.value.trim();
          if (!target) {
            page.innerHTML = '<h3>Web Browser</h3><p>Please enter a URL.</p>';
            return;
          }

          page.innerHTML = '<h3>Web Browser</h3><p>Loading...</p>';

          try {
            const html = await fetchViaProxy(target);
            const clean = stripHtml(html);
            const safeText = clean.length > 14000 ? `${clean.slice(0, 14000)}...` : clean;
            page.innerHTML = `<h3>Website preview</h3><pre style="white-space:pre-wrap;font-family:inherit;">${safeText}</pre>`;
          } catch (error) {
            page.innerHTML = `<h3>Proxy load failed</h3><p>${error.message}</p><p>Try a public website such as https://example.com.</p>`;
          }
        }

        goBtn.addEventListener('click', loadPage);
        addressBar.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') loadPage();
        });

        toolbar.appendChild(addressBar);
        toolbar.appendChild(goBtn);
        wrapper.appendChild(toolbar);
        wrapper.appendChild(page);
        return wrapper;
      }

      const appDefs = [
        {
          id: 'mycomputer',
          label: 'My Computer',
          x: 24,
          y: 24,
          icon: 'computer',
          title: 'My Computer',
          width: 470,
          height: 320,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'explorer';
            wrapper.innerHTML = `
              <div class="explorer-toolbar">My Computer</div>
              <div class="explorer-body">
                <div class="explorer-sidebar">
                  <div class="drive-row"><span class="drive-icon"></span> Hard Disk (C:)</div>
                  <div class="drive-row"><span class="drive-icon"></span> Floppy (A:)</div>
                  <div class="drive-row"><span class="drive-icon"></span> Network</div>
                </div>
                <div class="explorer-main">
                  <h3>System Information</h3>
                  <p>Windows 95</p>
                  <p>Intel Pentium</p>
                  <p>64 MB RAM</p>
                  <p>Video: 800x600</p>
                </div>
              </div>
            `;
            return wrapper;
          }
        },
        {
          id: 'documents',
          label: 'My Documents',
          x: 38,
          y: 120,
          icon: 'doc',
          title: 'My Documents',
          width: 420,
          height: 280,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'explorer';
            wrapper.innerHTML = `
              <div class="explorer-toolbar">My Documents</div>
              <div class="explorer-body">
                <div class="explorer-sidebar">
                  <div class="drive-row"><span class="drive-icon"></span> Resume.txt</div>
                  <div class="drive-row"><span class="drive-icon"></span> Holiday.jpg</div>
                  <div class="drive-row"><span class="drive-icon"></span> Notes.doc</div>
                </div>
                <div class="explorer-main">
                  <h3>Documents</h3>
                  <p>Classic personal files and nostalgia.</p>
                  <p>Double-click a document to open it.</p>
                </div>
              </div>
            `;
            return wrapper;
          }
        },
        {
          id: 'recycle',
          label: 'Recycle Bin',
          x: 280,
          y: 40,
          icon: 'bin',
          title: 'Recycle Bin',
          width: 300,
          height: 220,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'explorer';
            wrapper.innerHTML = `
              <div class="explorer-toolbar">Recycle Bin</div>
              <div class="explorer-body">
                <div class="explorer-sidebar">
                  <div class="drive-row"><span class="drive-icon"></span> Empty</div>
                </div>
                <div class="explorer-main">
                  <h3>Recycle Bin</h3>
                  <p>The bin is empty and ready for future nostalgia.</p>
                </div>
              </div>
            `;
            return wrapper;
          }
        },
        {
          id: 'ie',
          label: 'Internet Explorer',
          x: 150,
          y: 180,
          icon: 'browser',
          title: 'Internet Explorer',
          width: 560,
          height: 380,
          render: createBrowserApp
        },
        {
          id: 'notepad',
          label: 'Notepad',
          x: 440,
          y: 180,
          icon: 'notepad',
          title: 'Untitled - Notepad',
          width: 380,
          height: 280,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'notepad';
            const toolbar = document.createElement('div');
            toolbar.className = 'notepad-toolbar';
            toolbar.textContent = 'Note';
            const ta = document.createElement('textarea');
            ta.className = 'notepad-textarea';
            ta.value = 'Welcome to the retro desktop.\n\nThe proxy feature is enabled for the browser app, so you can preview pages without leaving the desktop.';
            wrapper.appendChild(toolbar);
            wrapper.appendChild(ta);
            return wrapper;
          }
        },
        {
          id: 'calc',
          label: 'Calculator',
          x: 520,
          y: 70,
          icon: 'calc',
          title: 'Calculator',
          width: 250,
          height: 290,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'calculator';
            const display = document.createElement('div');
            display.className = 'calc-display';
            display.textContent = '0';

            let value = '0';
            let stored = null;
            let operator = null;

            function setDisplay() {
              display.textContent = value.length > 10 ? Number(value).toPrecision(7).toString() : value;
            }

            function press(symbol) {
              if (/[0-9]/.test(symbol)) {
                value = value === '0' ? symbol : value + symbol;
              } else if (symbol === '.') {
                if (!value.includes('.')) value += '.';
              } else if (symbol === 'C') {
                value = '0'; stored = null; operator = null;
              } else if (symbol === '=') {
                if (stored !== null && operator) {
                  const left = Number(stored);
                  const right = Number(value);
                  const result = operator === '+' ? left + right : operator === '-' ? left - right : operator === '*' ? left * right : left / right;
                  value = String(result);
                  stored = null; operator = null;
                }
              } else if (['+','-','*','/'].includes(symbol)) {
                if (stored !== null && operator) {
                  const left = Number(stored);
                  const right = Number(value);
                  const result = operator === '+' ? left + right : operator === '-' ? left - right : operator === '*' ? left * right : left / right;
                  value = String(result);
                }
                stored = value;
                operator = symbol;
                value = '0';
              }
              setDisplay();
            }

            const keySets = [
              ['C', '/', '*', '←'],
              ['7', '8', '9', '-'],
              ['4', '5', '6', '+'],
              ['1', '2', '3', '='],
              ['0', '.']
            ];

            const grid = document.createElement('div');
            grid.className = 'calc-grid';
            keySets.flat().forEach((key) => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'calc-btn';
              btn.textContent = key;
              if (key === '0') btn.classList.add('wide');
              btn.addEventListener('click', () => press(key === '←' ? 'C' : key));
              grid.appendChild(btn);
            });

            wrapper.appendChild(display);
            wrapper.appendChild(grid);
            return wrapper;
          }
        },
        {
          id: 'minesweeper',
          label: 'Minesweeper',
          x: 200,
          y: 250,
          icon: 'game',
          title: 'Minesweeper',
          width: 260,
          height: 250,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'game-window';
            const toolbar = document.createElement('div');
            toolbar.className = 'game-toolbar';
            toolbar.textContent = 'Minesweeper';
            const content = document.createElement('div');
            content.className = 'game-content';

            const board = document.createElement('div');
            board.className = 'minesweeper-board';
            for (let i = 0; i < 81; i++) {
              const cell = document.createElement('div');
              cell.className = 'cell';
              if (i % 10 === 0) cell.textContent = '•';
              cell.addEventListener('click', () => {
                cell.classList.add('revealed');
                if (cell.textContent === '•') cell.textContent = 'X';
              });
              board.appendChild(cell);
            }

            content.appendChild(board);
            wrapper.appendChild(toolbar);
            wrapper.appendChild(content);
            return wrapper;
          }
        },
        {
          id: 'solitaire',
          label: 'Solitaire',
          x: 350,
          y: 220,
          icon: 'game',
          title: 'Solitaire',
          width: 320,
          height: 220,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'game-window';
            const toolbar = document.createElement('div');
            toolbar.className = 'game-toolbar';
            toolbar.textContent = 'Solitaire';
            const content = document.createElement('div');
            content.className = 'game-content';

            const board = document.createElement('div');
            board.className = 'solitaire-board';

            ['A', 'K', 'Q', 'J', '10'].forEach((value, index) => {
              const pile = document.createElement('div');
              pile.className = 'solitaire-pile';
              const card = document.createElement('div');
              card.className = `card ${index % 2 === 0 ? 'red' : 'black'}`;
              card.textContent = value;
              pile.appendChild(card);
              board.appendChild(pile);
            });

            content.appendChild(board);
            wrapper.appendChild(toolbar);
            wrapper.appendChild(content);
            return wrapper;
          }
        },
        {
          id: 'about',
          label: 'About',
          x: 180,
          y: 120,
          icon: 'notepad',
          title: 'About Windows 95',
          width: 360,
          height: 250,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'about-box';
            wrapper.innerHTML = `
              <div class="about-logo">Windows</div>
              <p>Desktop Nostalgia is a browser-based tribute to the iconic Windows 95 experience.</p>
              <p>Features include a boot splash, taskbar, retro apps, and a proxy-aware browser window.</p>
              <p>Built with HTML, CSS, and a lightweight JS shell for a self-contained experience.</p>
            `;
            return wrapper;
          }
        }
      ];

      appDefs.forEach((app, index) => {
        buildDeskIcon({
          id: app.id,
          label: app.label,
          x: 24 + ((index % 3) * 82),
          y: 24 + (Math.floor(index / 3) * 78),
          icon: app.icon,
          click: () => openWindow(app.id)
        });
      });

      document.querySelectorAll('.start-item').forEach((item) => {
        item.addEventListener('click', () => {
          const appId = item.dataset.app;
          openWindow(appId);
          startMenu.classList.remove('show');
          startBtn.classList.remove('active');
        });
      });

      startBtn.addEventListener('click', () => {
        const willOpen = !startMenu.classList.contains('show');
        startMenu.classList.toggle('show', willOpen);
        startBtn.classList.toggle('active', willOpen);
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('.start-menu') && !event.target.closest('.start-btn')) {
          startMenu.classList.remove('show');
          startBtn.classList.remove('active');
        }
      });

      formatClock();
      setInterval(formatClock, 60000);

      setTimeout(() => document.body.classList.add('booted'), 1800);

      const params = new URLSearchParams(window.location.search);
      if (params.has('demo')) {
        setTimeout(() => openWindow('ie'), 2200);
      }
    </script>
  </body>
</html>
