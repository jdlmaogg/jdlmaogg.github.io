<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows 95 Desktop</title>
    <style>
      :root {
        --win95-blue: #000080;
        --win95-blue-alt: #1084d0;
        --win95-gray-1: #c0c0c0;
        --win95-gray-2: #d4d0c8;
        --win95-gray-3: #808080;
        --win95-gray-4: #ffffff;
        --win95-gray-5: #000000;
        --win95-wallpaper-1: #008080;
        --win95-wallpaper-2: #0f8a8a;
        --win95-wallpaper-3: #0d7171;
        --win95-shadow: rgba(0, 0, 0, 0.35);
        --win95-taskbar: #c0c0c0;
        --win95-btn-face: #dfdfdf;
        --win95-green: #1b5e20;
        --win95-red: #b22222;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "MS Sans Serif", "Tahoma", sans-serif;
        background: #000;
        color: #000;
        cursor: default;
      }

      body {
        position: relative;
        background: linear-gradient(180deg, var(--win95-wallpaper-1) 0%, var(--win95-wallpaper-2) 28%, var(--win95-wallpaper-3) 100%);
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.02)),
          repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.025),
            rgba(0,0,0,0.025) 1px,
            transparent 1px,
            transparent 2px
          );
      }

      #desktop {
        position: absolute;
        inset: 0 0 36px 0;
        overflow: hidden;
      }

      .desktop-icon {
        position: absolute;
        width: 80px;
        padding: 4px 5px;
        color: #fff;
        text-align: center;
        font-size: 11px;
        line-height: 1.1;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.85);
        cursor: pointer;
      }

      .desktop-icon.selected {
        background: rgba(0,0,0,0.14);
        border: 1px dotted #fff;
      }

      .desktop-icon .icon {
        position: relative;
        display: block;
        width: 32px;
        height: 32px;
        margin: 0 auto 5px;
        filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.5));
      }

      .icon-computer::before,
      .icon-computer::after,
      .icon-doc::before,
      .icon-doc::after,
      .icon-bin::before,
      .icon-bin::after,
      .icon-browser::before,
      .icon-browser::after,
      .icon-notepad::before,
      .icon-notepad::after,
      .icon-calc::before,
      .icon-calc::after,
      .icon-game::before,
      .icon-game::after {
        content: "";
        position: absolute;
      }

      .icon-computer::before {
        left: 4px; right: 4px; bottom: 8px; height: 18px;
        background: #c0c0c0;
        border: 2px solid #666;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: inset -2px -2px 0 rgba(0,0,0,0.16);
      }

      .icon-computer::after {
        left: 8px; right: 8px; bottom: 2px; height: 7px;
        background: #c0c0c0;
        border: 2px solid #666;
        border-top: none;
      }

      .icon-doc::before {
        inset: 2px 8px 2px 8px;
        background: #fff;
        border: 1px solid rgba(0,0,0,0.4);
      }

      .icon-doc::after {
        left: 15px; top: 6px; width: 10px; height: 2px;
        background: #c0c0c0;
        box-shadow: 0 5px 0 #c0c0c0, 0 10px 0 #c0c0c0;
      }

      .icon-bin::before {
        left: 6px; right: 6px; bottom: 6px; height: 20px;
        background: #d9d9d9;
        border: 2px solid #666;
        border-top: none;
        box-shadow: inset 0 0 0 2px #fff;
      }

      .icon-bin::after {
        left: 7px; right: 7px; top: 4px; height: 6px;
        background: #d9d9d9;
        border: 2px solid #666;
        border-bottom: none;
      }

      .icon-browser::before {
        left: 4px; top: 4px; width: 24px; height: 18px;
        background: linear-gradient(180deg, #3a93ff, #165fe1);
        border: 2px solid #1d1d1d;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
      }

      .icon-browser::after {
        content: "e";
        position: absolute;
        left: 12px; top: 5px;
        color: white;
        font-size: 16px;
        font-weight: bold;
      }

      .icon-notepad::before {
        left: 8px; right: 8px; top: 4px; bottom: 4px;
        background: white;
        border: 1px solid rgba(0,0,0,0.5);
      }

      .icon-notepad::after {
        left: 13px; top: 9px; width: 12px; height: 2px;
        background: #bcbcbc;
        box-shadow: 0 4px 0 #bcbcbc, 0 8px 0 #bcbcbc;
      }

      .icon-calc::before {
        inset: 4px 5px 4px 5px;
        background: #d9d9d9;
        border: 2px solid #666;
        box-shadow: inset 1px 1px 0 #fff;
      }

      .icon-calc::after {
        content: "±";
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        font-weight: 700;
        font-size: 18px;
      }

      .icon-game::before {
        inset: 4px 5px 4px 5px;
        background: linear-gradient(180deg, #fafafa, #d9d9d9);
        border: 2px solid #666;
        box-shadow: inset 1px 1px 0 #fff;
      }

      .icon-game::after {
        content: "✦";
        left: 9px; top: 8px;
        color: #b22222;
        font-size: 17px;
        font-weight: 700;
      }

      .window {
        position: absolute;
        display: flex;
        flex-direction: column;
        min-width: 220px;
        min-height: 150px;
        background: var(--win95-gray-2);
        border: 2px solid #000;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: 2px 2px 0 var(--win95-shadow);
        overflow: hidden;
        z-index: 1;
      }

      .window.active {
        box-shadow: 3px 3px 0 rgba(0,0,0,0.45);
      }

      .title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 27px;
        padding: 4px 6px 4px 8px;
        color: white;
        background: linear-gradient(90deg, #000080, #1084d0);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
        cursor: move;
      }

      .title-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }

      .window-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .win-btn {
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--win95-gray-1);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        color: #000;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        padding: 0;
        margin: 0;
        cursor: pointer;
      }

      .win-btn:active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .window-body {
        flex: 1;
        background: var(--win95-gray-2);
        padding: 8px;
        overflow: auto;
      }

      .explorer, .browser, .notepad, .game-window {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .explorer {
        border: 2px inset #c0c0c0;
        background: white;
      }

      .explorer-toolbar,
      .browser-toolbar,
      .game-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: #efefef;
        border-bottom: 1px solid #808080;
        font-size: 12px;
      }

      .explorer-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .explorer-sidebar {
        width: 146px;
        background: #f3f3f3;
        border-right: 1px solid #808080;
        padding: 8px;
        font-size: 12px;
        line-height: 1.8;
      }

      .drive-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border: 1px solid transparent;
      }

      .drive-row:hover {
        background: #d9ebff;
        border-color: #000080;
      }

      .drive-icon {
        width: 18px; height: 18px;
        position: relative;
        background: linear-gradient(#7e7e7e, #a0a0a0);
        border: 1px solid #000;
      }

      .drive-icon::before {
        content: "";
        position: absolute;
        inset: 4px 3px 3px 3px;
        background: linear-gradient(#d8d8d8, #8d8d8d);
      }

      .explorer-main {
        flex: 1;
        padding: 10px;
        overflow: auto;
        font-size: 12px;
      }

      .explorer-main h3 {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .browser {
        border: 2px inset #c0c0c0;
        background: white;
      }

      .browser-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .address-bar {
        flex: 1;
        background: white;
        border: 1px solid #7a7a7a;
        padding: 3px 6px;
        font-size: 12px;
      }

      .browser-page {
        flex: 1;
        overflow: auto;
        padding: 12px;
        font-size: 12px;
        line-height: 1.6;
        background: #fff;
      }

      .browser-page h3, .browser-page h4 { margin-top: 0; }
      .browser-page a { color: #000080; text-decoration: underline; }

      .notepad {
        background: var(--win95-gray-2);
      }

      .notepad-toolbar {
        padding: 4px;
        background: var(--win95-gray-2);
        border-bottom: 1px solid #808080;
        font-size: 12px;
      }

      .notepad-textarea {
        flex: 1;
        width: 100%;
        resize: none;
        border: 2px inset #c0c0c0;
        background: white;
        padding: 8px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        outline: none;
      }

      .calculator {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: var(--win95-gray-2);
        padding: 8px;
      }

      .calc-display {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        background: white;
        border: 2px inset #bdbdbd;
        min-height: 48px;
        padding: 8px;
        margin-bottom: 8px;
        font-family: "Courier New", monospace;
        font-size: 22px;
        font-weight: 700;
      }

      .calc-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .calc-btn {
        height: 34px;
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        background: var(--win95-btn-face);
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }

      .calc-btn:active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .calc-btn.wide {
        grid-column: span 2;
      }

      .about-box {
        height: 100%;
        border: 1px solid #000;
        background: white;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
      }

      .about-logo {
        font-size: 28px;
        font-weight: 700;
        color: var(--win95-blue);
        text-align: center;
        margin-bottom: 10px;
      }

      .game-window {
        background: var(--win95-gray-2);
      }

      .game-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #c0c0c0;
        padding: 10px;
      }

      .minesweeper-board {
        display: grid;
        grid-template-columns: repeat(9, 24px);
        gap: 2px;
        background: #808080;
        border: 2px solid #fff;
        box-shadow: inset 2px 2px 0 #7a7a7a;
        padding: 4px;
      }

      .cell {
        width: 24px; height: 24px;
        background: #c0c0c0;
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .cell.revealed {
        border: 1px solid #808080;
        background: #d4d0c8;
        box-shadow: inset 1px 1px 0 rgba(0,0,0,0.15);
        cursor: default;
      }

      .solitaire-board {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
        max-width: 340px;
        min-height: 180px;
        background: var(--win95-green);
        border: 2px solid #000;
        padding: 16px 12px;
        box-shadow: inset 2px 2px 0 rgba(255,255,255,0.25);
      }

      .solitaire-pile {
        position: relative;
        width: 42px; height: 56px;
        border: 2px solid rgba(255,255,255,0.35);
        border-radius: 2px;
        background: rgba(255,255,255,0.12);
      }

      .card {
        position: relative;
        width: 42px; height: 56px;
        display: flex;
        align-items: center; justify-content: center;
        border: 2px solid #000;
        border-radius: 3px;
        background: white;
        font-size: 18px;
        font-weight: 700;
        box-shadow: 1px 1px 0 rgba(0,0,0,0.25);
      }

      .card.red { color: #c00000; }
      .card.black { color: #000; }

      .taskbar {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 36px;
        background: var(--win95-taskbar);
        border-top: 2px solid #fff;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        z-index: 2000;
      }

      .start-btn {
        height: 28px;
        min-width: 94px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: linear-gradient(180deg, #f8f8f8, #d6d6d6);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        padding: 0 14px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .start-btn:active,
      .start-btn.active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .start-logo {
        display: inline-block;
        width: 15px; height: 15px;
        position: relative;
        background: linear-gradient(135deg, #ff0000 0%, #ff0000 45%, #000 45%, #000 100%);
        border: 1px solid #000;
        transform: rotate(45deg);
      }

      .taskbar-buttons {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 1;
        overflow: hidden;
      }

      .task-btn {
        min-width: 130px;
        max-width: 180px;
        height: 28px;
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        padding: 0 8px;
        background: linear-gradient(180deg, #f7f7f7, #d6d6d6);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        font-size: 12px;
        cursor: pointer;
      }

      .task-btn.active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        background: linear-gradient(180deg, #ddd, #c0c0c0);
      }

      .taskbar-clock {
        width: 92px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d4d0c8;
        border-top: 2px solid #7b7b7b;
        border-left: 2px solid #7b7b7b;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 0 6px;
      }

      .start-menu {
        position: absolute;
        left: 4px;
        bottom: 38px;
        width: 270px;
        height: 390px;
        background: var(--win95-gray-1);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        display: none;
        z-index: 3000;
      }

      .start-menu.show { display: flex; }

      .start-side {
        width: 32px;
        background: linear-gradient(180deg, #7a7a7a, #c0c0c0);
        color: white;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 1px;
      }

      .start-items {
        flex: 1;
        background: #c0c0c0;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .start-item {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        padding: 6px 8px;
        font-size: 12px;
        cursor: pointer;
      }

      .start-item:hover {
        background: #000080;
        color: white;
      }

      .mini-icon {
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #000;
        background: #d9d9d9;
        font-size: 12px;
        font-weight: 700;
      }

      .window-resize-handle {
        position: absolute;
        right: 0; bottom: 0;
        width: 12px;
        height: 12px;
        background: linear-gradient(135deg, #808080 0%, #d9d9d9 35%, #fff 35%, #fff 100%);
        border-top: 1px solid #000;
        border-left: 1px solid #000;
        cursor: nwse-resize;
      }

      .hidden { display: none !important; }

      .boot-screen {
        position: absolute;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #000000 0%, #050d1f 100%);
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }

      body.booted .boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #fff;
        text-align: center;
        transform: scale(1.02);
        animation: bootPulse 2.2s ease-in-out infinite alternate;
      }

      .boot-logo {
        width: 205px; height: 62px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #1f52ff 0%, #000080 52%, #050d88 100%);
        border: 2px solid #4e7aff;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08), 0 0 18px rgba(94,147,255,0.42);
        color: #f3f9ff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      }

      .boot-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(230, 240, 255, 0.9);
      }

      .boot-cursor {
        display: inline-block;
        width: 12px;
        height: 18px;
        background: #f2f7ff;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
        animation: blinkCursor 0.7s steps(1) infinite;
      }

      @keyframes blinkCursor {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }

      @keyframes bootPulse {
        from { transform: scale(0.98); opacity: 0.76; }
        to { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="boot-screen">
      <div class="boot-panel">
        <div class="boot-logo">Windows</div>
        <div class="boot-label">Starting<span class="boot-cursor"></span></div>
      </div>
    </div>

    <div id="desktop"></div>

    <div id="taskbar" class="taskbar">
      <div id="startBtn" class="start-btn"><span class="start-logo"></span><span>Start</span></div>
      <div id="taskbarButtons" class="taskbar-buttons"></div>
      <div id="clock" class="taskbar-clock">12:00 PM</div>
    </div>

    <div id="startMenu" class="start-menu">
      <div class="start-side">Start</div>
      <div class="start-items">
        <div class="start-item" data-app="mycomputer"><span class="mini-icon">💻</span> My Computer</div>
        <div class="start-item" data-app="documents"><span class="mini-icon">📁</span> My Documents</div>
        <div class="start-item" data-app="recycle"><span class="mini-icon">🗑</span> Recycle Bin</div>
        <div class="start-item" data-app="ie"><span class="mini-icon">🌐</span> Internet Explorer</div>
        <div class="start-item" data-app="notepad"><span class="mini-icon">📝</span> Notepad</div>
        <div class="start-item" data-app="calc"><span class="mini-icon">🧮</span> Calculator</div>
