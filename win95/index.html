<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows 95 Desktop</title>
    <style>
      :root {
        --win95-blue: #000080;
        --win95-blue-alt: #1084d0;
        --win95-gray-1: #c0c0c0;
        --win95-gray-2: #d4d0c8;
        --win95-gray-3: #808080;
        --win95-gray-4: #ffffff;
        --win95-gray-5: #000000;
        --win95-wallpaper-1: #008080;
        --win95-wallpaper-2: #0f8a8a;
        --win95-wallpaper-3: #0d7171;
        --win95-shadow: rgba(0, 0, 0, 0.35);
        --win95-taskbar: #c0c0c0;
        --win95-btn-face: #dfdfdf;
        --win95-green: #1b5e20;
        --win95-red: #b22222;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "MS Sans Serif", "Tahoma", sans-serif;
        background: #000;
        color: #000;
        cursor: default;
      }

      body {
        position: relative;
        background: linear-gradient(180deg, var(--win95-wallpaper-1) 0%, var(--win95-wallpaper-2) 28%, var(--win95-wallpaper-3) 100%);
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.02)),
          repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.025),
            rgba(0,0,0,0.025) 1px,
            transparent 1px,
            transparent 2px
          );
      }

      #desktop {
        position: absolute;
        inset: 0 0 36px 0;
        overflow: hidden;
      }

      .desktop-icon {
        position: absolute;
        width: 78px;
        padding: 4px 5px;
        color: #fff;
        text-align: center;
        font-size: 11px;
        line-height: 1.1;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.85);
        cursor: pointer;
      }

      .desktop-icon.selected {
        background: rgba(0,0,0,0.14);
        border: 1px dotted #fff;
      }

      .desktop-icon .icon {
        position: relative;
        width: 32px;
        height: 32px;
        margin: 0 auto 5px;
        display: block;
        filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.5));
      }

      .icon-computer::before {
        content: "";
        position: absolute;
        left: 4px;
        right: 4px;
        bottom: 8px;
        height: 18px;
        background: #c0c0c0;
        border: 2px solid #666;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: inset -2px -2px 0 rgba(0,0,0,0.16);
      }

      .icon-computer::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 2px;
        height: 7px;
        background: #c0c0c0;
        border: 2px solid #666;
        border-top: none;
      }

      .icon-doc::before {
        content: "";
        position: absolute;
        inset: 2px 8px 2px 8px;
        background: #fff;
        border: 1px solid rgba(0,0,0,0.4);
      }

      .icon-doc::after {
        content: "";
        position: absolute;
        left: 15px;
        top: 6px;
        width: 10px;
        height: 2px;
        background: #c0c0c0;
        box-shadow: 0 5px 0 #c0c0c0, 0 10px 0 #c0c0c0;
      }

      .icon-bin::before {
        content: "";
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        height: 20px;
        background: #d9d9d9;
        border: 2px solid #666;
        border-top: none;
        box-shadow: inset 0 0 0 2px #fff;
      }

      .icon-bin::after {
        content: "";
        position: absolute;
        left: 7px;
        right: 7px;
        top: 4px;
        height: 6px;
        background: #d9d9d9;
        border: 2px solid #666;
        border-bottom: none;
      }

      .icon-browser::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 4px;
        width: 24px;
        height: 18px;
        background: linear-gradient(180deg, #3a93ff, #165fe1);
        border: 2px solid #1d1d1d;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
      }

      .icon-browser::after {
        content: "e";
        position: absolute;
        left: 12px;
        top: 5px;
        color: white;
        font-size: 16px;
        font-weight: bold;
      }

      .icon-notepad::before {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        top: 4px;
        bottom: 4px;
        background: white;
        border: 1px solid rgba(0,0,0,0.5);
      }

      .icon-notepad::after {
        content: "";
        position: absolute;
        left: 13px;
        top: 9px;
        width: 12px;
        height: 2px;
        background: #bcbcbc;
        box-shadow: 0 4px 0 #bcbcbc, 0 8px 0 #bcbcbc;
      }

      .icon-calc::before {
        content: "";
        position: absolute;
        inset: 4px 5px 4px 5px;
        background: #d9d9d9;
        border: 2px solid #666;
        box-shadow: inset 1px 1px 0 #fff;
      }

      .icon-calc::after {
        content: "±";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        font-weight: 700;
        font-size: 18px;
      }

      .icon-game::before {
        content: "";
        position: absolute;
        inset: 4px 5px 4px 5px;
        background: linear-gradient(180deg, #fafafa, #d9d9d9);
        border: 2px solid #666;
        box-shadow: inset 1px 1px 0 #fff;
      }

      .icon-game::after {
        content: "✦";
        position: absolute;
        left: 9px;
        top: 8px;
        color: #b22222;
        font-size: 17px;
        font-weight: 700;
      }

      .window {
        position: absolute;
        display: flex;
        flex-direction: column;
        min-width: 220px;
        min-height: 150px;
        background: var(--win95-gray-2);
        border: 2px solid #000;
        border-top-color: #fff;
        border-left-color: #fff;
        box-shadow: 2px 2px 0 var(--win95-shadow);
        overflow: hidden;
        z-index: 1;
      }

      .window.active {
        box-shadow: 3px 3px 0 rgba(0,0,0,0.45);
      }

      .title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 27px;
        padding: 4px 6px 4px 8px;
        color: white;
        background: linear-gradient(90deg, #000080, #1084d0);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
        cursor: move;
      }

      .title-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }

      .window-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .win-btn {
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--win95-gray-1);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        color: #000;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        padding: 0;
        margin: 0;
        cursor: pointer;
      }

      .win-btn:active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .window-body {
        flex: 1;
        background: var(--win95-gray-2);
        padding: 8px;
        overflow: auto;
      }

      .explorer,
      .browser,
      .notepad,
      .game-window {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .explorer {
        border: 2px inset #c0c0c0;
        background: white;
      }

      .explorer-toolbar,
      .browser-toolbar,
      .game-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: #efefef;
        border-bottom: 1px solid #808080;
        font-size: 12px;
      }

      .explorer-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .explorer-sidebar {
        width: 146px;
        background: #f3f3f3;
        border-right: 1px solid #808080;
        padding: 8px;
        font-size: 12px;
        line-height: 1.8;
      }

      .drive-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border: 1px solid transparent;
      }

      .drive-row:hover {
        background: #d9ebff;
        border-color: #000080;
      }

      .drive-icon {
        width: 18px;
        height: 18px;
        position: relative;
        background: linear-gradient(#7e7e7e, #a0a0a0);
        border: 1px solid #000;
      }

      .drive-icon::before {
        content: "";
        position: absolute;
        inset: 4px 3px 3px 3px;
        background: linear-gradient(#d8d8d8, #8d8d8d);
      }

      .explorer-main {
        flex: 1;
        padding: 10px;
        overflow: auto;
        font-size: 12px;
      }

      .explorer-main h3 {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .browser {
        border: 2px inset #c0c0c0;
        background: white;
      }

      .address-bar {
        flex: 1;
        background: white;
        border: 1px solid #7a7a7a;
        padding: 3px 6px;
        font-size: 12px;
      }

      .browser-page {
        flex: 1;
        overflow: auto;
        padding: 12px;
        font-size: 12px;
        line-height: 1.6;
      }

      .browser-page h3,
      .browser-page h4 {
        margin-top: 0;
      }

      .browser-page a {
        color: #000080;
        text-decoration: underline;
      }

      .notepad {
        background: var(--win95-gray-2);
      }

      .notepad-toolbar {
        padding: 4px;
        background: var(--win95-gray-2);
        border-bottom: 1px solid #808080;
        font-size: 12px;
      }

      .notepad-textarea {
        flex: 1;
        width: 100%;
        resize: none;
        border: 2px inset #c0c0c0;
        background: white;
        padding: 8px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        outline: none;
      }

      .calculator {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: var(--win95-gray-2);
        padding: 8px;
      }

      .calc-display {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        background: white;
        border: 2px inset #bdbdbd;
        min-height: 48px;
        padding: 8px;
        margin-bottom: 8px;
        font-family: "Courier New", monospace;
        font-size: 22px;
        font-weight: 700;
      }

      .calc-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .calc-btn {
        height: 34px;
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        background: var(--win95-btn-face);
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }

      .calc-btn:active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .calc-btn.wide {
        grid-column: span 2;
      }

      .about-box {
        height: 100%;
        border: 1px solid #000;
        background: white;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
      }

      .about-logo {
        font-size: 28px;
        font-weight: 700;
        color: var(--win95-blue);
        text-align: center;
        margin-bottom: 10px;
      }

      .game-window {
        background: var(--win95-gray-2);
      }

      .game-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #c0c0c0;
        padding: 10px;
      }

      .minesweeper-board {
        display: grid;
        grid-template-columns: repeat(9, 24px);
        gap: 2px;
        background: #808080;
        border: 2px solid #fff;
        box-shadow: inset 2px 2px 0 #7a7a7a;
        padding: 4px;
      }

      .cell {
        width: 24px;
        height: 24px;
        background: #c0c0c0;
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .cell.revealed {
        border: 1px solid #808080;
        background: #d4d0c8;
        box-shadow: inset 1px 1px 0 rgba(0,0,0,0.15);
        cursor: default;
      }

      .solitaire-board {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
        max-width: 340px;
        min-height: 180px;
        background: var(--win95-green);
        border: 2px solid #000;
        padding: 16px 12px;
        box-shadow: inset 2px 2px 0 rgba(255,255,255,0.25);
      }

      .solitaire-pile {
        position: relative;
        width: 42px;
        height: 56px;
        border: 2px solid rgba(255,255,255,0.35);
        border-radius: 2px;
        background: rgba(255,255,255,0.12);
      }

      .card {
        position: relative;
        width: 42px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #000;
        border-radius: 3px;
        background: white;
        font-size: 18px;
        font-weight: 700;
        box-shadow: 1px 1px 0 rgba(0,0,0,0.25);
      }

      .card.red {
        color: #c00000;
      }

      .card.black {
        color: #000;
      }

      .taskbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 36px;
        background: var(--win95-taskbar);
        border-top: 2px solid #fff;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        z-index: 2000;
      }

      .start-btn {
        height: 28px;
        min-width: 94px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: linear-gradient(180deg, #f8f8f8, #d6d6d6);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        padding: 0 14px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .start-btn:active,
      .start-btn.active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }

      .start-logo {
        display: inline-block;
        width: 15px;
        height: 15px;
        position: relative;
        background: linear-gradient(135deg, #ff0000 0%, #ff0000 45%, #000 45%, #000 100%);
        border: 1px solid #000;
        transform: rotate(45deg);
      }

      .taskbar-buttons {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 1;
        overflow: hidden;
      }

      .task-btn {
        min-width: 130px;
        max-width: 180px;
        height: 28px;
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        padding: 0 8px;
        background: linear-gradient(180deg, #f7f7f7, #d6d6d6);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        font-size: 12px;
        cursor: pointer;
      }

      .task-btn.active {
        border-top: 2px solid #808080;
        border-left: 2px solid #808080;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        background: linear-gradient(180deg, #ddd, #c0c0c0);
      }

      .taskbar-clock {
        width: 92px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d4d0c8;
        border-top: 2px solid #7b7b7b;
        border-left: 2px solid #7b7b7b;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 0 6px;
      }

      .start-menu {
        position: absolute;
        left: 4px;
        bottom: 38px;
        width: 270px;
        height: 390px;
        background: var(--win95-gray-1);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
        border-right: 2px solid #808080;
        border-bottom: 2px solid #808080;
        display: none;
        z-index: 3000;
      }

      .start-menu.show {
        display: flex;
      }

      .start-side {
        width: 32px;
        background: linear-gradient(180deg, #7a7a7a, #c0c0c0);
        color: white;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 1px;
      }

      .start-items {
        flex: 1;
        background: #c0c0c0;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .start-item {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        padding: 6px 8px;
        font-size: 12px;
        cursor: pointer;
      }

      .start-item:hover {
        background: #000080;
        color: white;
      }

      .mini-icon {
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #000;
        background: #d9d9d9;
        font-size: 12px;
        font-weight: 700;
      }

      .window-resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 12px;
        height: 12px;
        background: linear-gradient(135deg, #808080 0%, #d9d9d9 35%, #fff 35%, #fff 100%);
        border-top: 1px solid #000;
        border-left: 1px solid #000;
        cursor: nwse-resize;
      }

      .hidden {
        display: none !important;
      }

      .boot-screen {
        position: absolute;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #000000 0%, #050d1f 100%);
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }

      body.booted .boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #fff;
        text-align: center;
        transform: scale(1.02);
        animation: bootPulse 2.2s ease-in-out infinite alternate;
      }

      .boot-logo {
        width: 205px;
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #1f52ff 0%, #000080 52%, #050d88 100%);
        border: 2px solid #4e7aff;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08), 0 0 18px rgba(94,147,255,0.42);
        color: #f3f9ff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      }

      .boot-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(230, 240, 255, 0.9);
      }

      .boot-cursor {
        display: inline-block;
        width: 12px;
        height: 18px;
        background: #f2f7ff;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
        animation: blinkCursor 0.7s steps(1) infinite;
      }

      @keyframes blinkCursor {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }

      @keyframes bootPulse {
        from { transform: scale(0.98); opacity: 0.76; }
        to { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="boot-screen">
      <div class="boot-panel">
        <div class="boot-logo">Windows</div>
        <div class="boot-label">Starting<span class="boot-cursor"></span></div>
      </div>
    </div>

    <div id="desktop"></div>

    <div id="taskbar" class="taskbar">
      <div id="startBtn" class="start-btn"><span class="start-logo"></span><span>Start</span></div>
      <div id="taskbarButtons" class="taskbar-buttons"></div>
      <div id="clock" class="taskbar-clock">12:00 PM</div>
    </div>

    <div id="startMenu" class="start-menu">
      <div class="start-side">Start</div>
      <div class="start-items">
        <div class="start-item" data-app="mycomputer"><span class="mini-icon">💻</span> My Computer</div>
        <div class="start-item" data-app="documents"><span class="mini-icon">📁</span> My Documents</div>
        <div class="start-item" data-app="recycle"><span class="mini-icon">🗑</span> Recycle Bin</div>
        <div class="start-item" data-app="ie"><span class="mini-icon">🌐</span> Internet Explorer</div>
        <div class="start-item" data-app="notepad"><span class="mini-icon">📝</span> Notepad</div>
        <div class="start-item" data-app="calc"><span class="mini-icon">🧮</span> Calculator</div>
        <div class="start-item" data-app="minesweeper"><span class="mini-icon">💣</span> Minesweeper</div>
        <div class="start-item" data-app="solitaire"><span class="mini-icon">♠</span> Solitaire</div>
        <div class="start-item" data-app="about"><span class="mini-icon">ℹ</span> About</div>
      </div>
    </div>

    <script>
      const desktop = document.getElementById('desktop');
      const taskbarButtons = document.getElementById('taskbarButtons');
      const startBtn = document.getElementById('startBtn');
      const startMenu = document.getElementById('startMenu');
      const clock = document.getElementById('clock');
      const windowRegistry = new Map();
      let zCounter = 10;

      const appDefs = [
        {
          id: 'mycomputer',
          label: 'My Computer',
          x: 24,
          y: 24,
          icon: 'computer',
          title: 'My Computer',
          width: 470,
          height: 320,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'explorer';
            wrapper.innerHTML = `
              <div class="explorer-toolbar">My Computer</div>
              <div class="explorer-body">
                <div class="explorer-sidebar">
                  <div class="drive-row"><span class="drive-icon"></span> Hard Disk (C:)</div>
                  <div class="drive-row"><span class="drive-icon"></span> Floppy (A:)</div>
                  <div class="drive-row"><span class="drive-icon"></span> Network</div>
                </div>
                <div class="explorer-main">
                  <h3>System Information</h3>
                  <p>Windows 95</p>
                  <p>Intel Pentium</p>
                  <p>64 MB RAM</p>
                  <p>Video: 800x600</p>
                </div>
              </div>
            `;
            return wrapper;
          }
        },
        {
          id: 'documents',
          label: 'My Documents',
          x: 24,
          y: 110,
          icon: 'doc',
          title: 'My Documents',
          width: 420,
          height: 280,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'explorer';
            wrapper.innerHTML = `
              <div class="explorer-toolbar">My Documents</div>
              <div class="explorer-body">
                <div class="explorer-sidebar">
                  <div class="drive-row"><span class="drive-icon"></span> Resume.txt</div>
                  <div class="drive-row"><span class="drive-icon"></span> Holiday.jpg</div>
                  <div class="drive-row"><span class="drive-icon"></span> Notes.doc</div>
                </div>
                <div class="explorer-main">
                  <h3>Documents</h3>
                  <p>My Documents is the default personal folder in Windows 95.</p>
                  <p>Double-click a document to open it.</p>
                </div>
              </div>
            `;
            return wrapper;
          }
        },
        {
          id: 'recycle',
          label: 'Recycle Bin',
          x: 24,
          y: 196,
          icon: 'bin',
          title: 'Recycle Bin',
          width: 340,
          height: 200,
          render: () => {
            const box = document.createElement('div');
            box.className = 'about-box';
            box.innerHTML = `
              <div class="about-logo">Recycle Bin</div>
              <p>Empty</p>
              <p>Files deleted from the desktop are kept here until removed permanently.</p>
            `;
            return box;
          }
        },
        {
          id: 'ie',
          label: 'Internet Explorer',
          x: 24,
          y: 282,
          icon: 'browser',
          title: 'Internet Explorer',
          width: 560,
          height: 420,
          render: () => {
            const browser = document.createElement('div');
            browser.className = 'browser';
            browser.innerHTML = `
              <div class="browser-toolbar">
                <span>Address</span>
                <div class="address-bar">https://www.microsoft.com</div>
              </div>
              <div class="browser-page">
                <h3>Welcome to the Internet</h3>
                <p>Hi. This is the classic internet experience from the windows 95 era.</p>
                <ul>
                  <li><a href="#">Start</a></li>
                  <li><a href="#">Favorites</a></li>
                  <li><a href="#">History</a></li>
                  <li><a href="#">Channels</a></li>
                </ul>
                <h4>Featured</h4>
                <p>Windows 95 changed the way people used personal computers. It was bright, colorful, and full of possibilities.</p>
              </div>
            `;
            return browser;
          }
        },
        {
          id: 'notepad',
          label: 'Notepad',
          x: 118,
          y: 24,
          icon: 'notepad',
          title: 'Notepad',
          width: 440,
          height: 320,
          render: () => {
            const wrapper = document.createElement('div');
            wrapper.className = 'notepad';
            wrapper.innerHTML = `
              <div class="notepad-toolbar">File Edit Search Help</div>
              <textarea class="notepad-textarea">Welcome to Windows 95.

This is a classic personal computer desktop recreated in the browser.

The future is here.
</textarea>
            `;
            return wrapper;
          }
        },
        {
          id: 'calc',
          label: 'Calculator',
          x: 118,
          y: 110,
          icon: 'calc',
          title: 'Calculator',
          width: 240,
          height: 310,
          render: () => {
            const calc = document.createElement('div');
            calc.className = 'calculator';
            calc.innerHTML = `
              <div class="calc-display">0</div>
              <div class="calc-grid">
                <button class="calc-btn wide">C</button>
                <button class="calc-btn">±</button>
                <button class="calc-btn">/</button>
                <button class="calc-btn">7</button>
                <button class="calc-btn">8</button>
                <button class="calc-btn">9</button>
                <button class="calc-btn">*</button>
                <button class="calc-btn">4</button>
                <button class="calc-btn">5</button>
                <button class="calc-btn">6</button>
                <button class="calc-btn">-</button>
                <button class="calc-btn">1</button>
                <button class="calc-btn">2</button>
                <button class="calc-btn">3</button>
                <button class="calc-btn">+</button>
                <button class="calc-btn wide">0</button>
                <button class="calc-btn">.</button>
                <button class="calc-btn">=</button>
              </div>
            `;
            return calc;
          }
        },
        {
          id: 'minesweeper',
          label: 'Minesweeper',
          x: 118,
          y: 196,
          icon: 'game',
          title: 'Minesweeper',
          width: 280,
          height: 340,
          render: () => {
            const game = document.createElement('div');
            game.className = 'game-window';
            game.innerHTML = `
              <div class="game-toolbar"><span>Face</span><span>Time</span></div>
              <div class="game-content">
                <div class="minesweeper-board"></div>
              </div>
            `;
            const board = game.querySelector('.minesweeper-board');
            for (let i = 0; i < 81; i++) {
              const cell = document.createElement('button');
              cell.className = 'cell';
              cell.type = 'button';
              cell.addEventListener('click', () => {
                cell.classList.add('revealed');
                if (i % 9 === 0) cell.textContent = '•';
              });
              board.appendChild(cell);
            }
            return game;
          }
        },
        {
          id: 'solitaire',
          label: 'Solitaire',
          x: 118,
          y: 282,
          icon: 'game',
          title: 'Solitaire',
          width: 360,
          height: 300,
          render: () => {
            const game = document.createElement('div');
            game.className = 'game-window';
            game.innerHTML = `
              <div class="game-toolbar"><span>Solitaire</span><span>Score: 0</span></div>
              <div class="game-content">
                <div class="solitaire-board"></div>
              </div>
            `;
            const board = game.querySelector('.solitaire-board');
            for (let i = 0; i < 7; i++) {
              const pile = document.createElement('div');
              pile.className = 'solitaire-pile';
              const card = document.createElement('div');
              card.className = 'card ' + (i % 2 === 0 ? 'red' : 'black');
              card.textContent = i % 2 === 0 ? '♥' : '♣';
              pile.appendChild(card);
              board.appendChild(pile);
            }
            return game;
          }
        },
        {
          id: 'about',
          label: 'About',
          x: 212,
          y: 24,
          icon: 'doc',
          title: 'About Windows 95',
          width: 330,
          height: 210,
          render: () => {
            const box = document.createElement('div');
            box.className = 'about-box';
            box.innerHTML = `
              <div class="about-logo">Windows</div>
              <p>Version 4.00.0950</p>
              <p>© 1985-1995 Microsoft Corporation</p>
              <p>All rights reserved.</p>
              <p>This is a faithful browser recreation of the classic 1995 desktop experience.</p>
            `;
            return box;
          }
        }
      ];

      function updateClock() {
        const now = new Date();
        const h = (now.getHours() % 12) || 12;
        const m = String(now.getMinutes()).padStart(2, '0');
        const suffix = now.getHours() >= 12 ? 'PM' : 'AM';
        clock.textContent = `${h}:${m} ${suffix}`;
      }

      function renderDesktopIcons() {
        appDefs.forEach((app) => {
          const icon = document.createElement('div');
          icon.className = 'desktop-icon';
          icon.dataset.app = app.id;
          icon.style.left = `${app.x}px`;
          icon.style.top = `${app.y}px`;
          icon.innerHTML = `<div class="icon icon-${app.icon}"></div><div>${app.label}</div>`;
          icon.addEventListener('click', () => {
            document.querySelectorAll('.desktop-icon').forEach((node) => node.classList.remove('selected'));
            icon.classList.add('selected');
          });
          icon.addEventListener('dblclick', () => openApp(app.id));
          desktop.appendChild(icon);
        });
      }

      function focusWindow(win, appId) {
        document.querySelectorAll('.window').forEach((w) => {
          w.style.zIndex = '1';
          w.classList.remove('active');
        });
        win.style.zIndex = String(zCounter++);
        win.classList.add('active');
        document.querySelectorAll('.task-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.app === appId);
        });
      }

      function createTaskButton(appId) {
        const app = windowRegistry.get(appId);
        if (!app || app.taskButton) return;
        const taskBtn = document.createElement('div');
        taskBtn.className = 'task-btn';
        taskBtn.dataset.app = appId;
        taskBtn.textContent = app.title;
        taskBtn.addEventListener('click', () => {
          if (app.win.classList.contains('hidden')) {
            app.win.classList.remove('hidden');
          }
          focusWindow(app.win, appId);
        });
        taskbarButtons.appendChild(taskBtn);
        app.taskButton = taskBtn;
      }

      function addWindow(app) {
        const win = document.createElement('div');
        win.className = 'window';
        win.style.width = `${app.width}px`;
        win.style.height = `${app.height}px`;
        win.style.left = `${app.x + 200}px`;
        win.style.top = `${app.y + 30}px`;
        win.dataset.app = app.id;

        const bar = document.createElement('div');
        bar.className = 'title-bar';
        bar.innerHTML = `<div class="title-text">${app.title}</div><div class="window-controls"><button class="win-btn" data-action="minimize">_</button><button class="win-btn" data-action="maximize">▢</button><button class="win-btn" data-action="close">×</button></div>`;

        const body = document.createElement('div');
        body.className = 'window-body';
        body.appendChild(app.render());

        const resize = document.createElement('div');
        resize.className = 'window-resize-handle';

        win.appendChild(bar);
        win.appendChild(body);
        win.appendChild(resize);
        document.body.appendChild(win);

        bar.querySelectorAll('.win-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const action = btn.dataset.action;
            if (action === 'close' || action === 'minimize') {
              win.classList.add('hidden');
              if (app.taskButton) app.taskButton.classList.remove('active');
            }
            if (action === 'maximize') {
              const currentW = win.style.width;
              if (currentW === 'calc(100vw - 40px)' || currentW === '100%') {
                win.style.width = `${app.width}px`;
                win.style.height = `${app.height}px`;
                win.style.left = `${app.x + 200}px`;
                win.style.top = `${app.y + 30}px`;
              } else {
                win.style.width = 'calc(100vw - 40px)';
                win.style.height = 'calc(100vh - 92px)';
                win.style.left = '20px';
                win.style.top = '20px';
              }
            }
          });
        });

        let dragState = null;
        bar.addEventListener('mousedown', (event) => {
          if (event.target.closest('.win-btn')) return;
          dragState = {
            x: event.clientX,
            y: event.clientY,
            left: parseFloat(win.style.left || 0),
            top: parseFloat(win.style.top || 0)
          };
          focusWindow(win, app.id);
        });

        window.addEventListener('mousemove', (event) => {
          if (!dragState) return;
          const dx = event.clientX - dragState.x;
          const dy = event.clientY - dragState.y;
          win.style.left = `${dragState.left + dx}px`;
          win.style.top = `${dragState.top + dy}px`;
        });

        window.addEventListener('mouseup', () => {
          dragState = null;
        });

        app.win = win;
        windowRegistry.set(app.id, app);
        createTaskButton(app.id);
        focusWindow(win, app.id);
      }

      function openApp(appId) {
        let app = windowRegistry.get(appId);
        if (!app) {
          const def = appDefs.find((item) => item.id === appId);
          if (!def) return;
          app = { ...def };
          addWindow(app);
          return;
        }

        app.win.classList.remove('hidden');
        focusWindow(app.win, appId);
      }

      function bindStartMenu() {
        startBtn.addEventListener('click', () => {
          startMenu.classList.toggle('show');
          startBtn.classList.toggle('active', startMenu.classList.contains('show'));
        });

        document.querySelectorAll('.start-item').forEach((item) => {
          item.addEventListener('click', () => {
            openApp(item.dataset.app);
            startMenu.classList.remove('show');
            startBtn.classList.remove('active');
          });
        });

        document.addEventListener('click', (event) => {
          if (!startMenu.contains(event.target) && !startBtn.contains(event.target)) {
            startMenu.classList.remove('show');
            startBtn.classList.remove('active');
          }
        });
      }

      function bootSequence() {
        setTimeout(() => {
          document.body.classList.add('booted');
        }, 2000);
      }

      renderDesktopIcons();
      bindStartMenu();
      updateClock();
      setInterval(updateClock, 1000);
      bootSequence();
    </script>
  </body>
</html>
